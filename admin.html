<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>डैशबोर्ड — वैदिक शोध संस्थान</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css?v=5">
</head>
<body>
<div class="toran" aria-hidden="true"></div>

<!-- login -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>वैदिक शोध संस्थान</h1>
    <p id="loginMsg">डैशबोर्ड में प्रवेश करें</p>
    <label class="f">पासवर्ड<input type="password" id="pw" autocomplete="current-password" required></label>
    <label class="f" id="pw2wrap" hidden>पासवर्ड दोबारा लिखें<input type="password" id="pw2" autocomplete="new-password"></label>
    <p class="err" id="loginErr"></p>
    <button class="btn btn-primary" style="width:100%">प्रवेश करें</button>
    <p class="hint"><a href="index.html">← वेबसाइट पर जाएँ</a></p>
  </form>
</div>

<!-- app -->
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-brand"><b>वैदिक शोध संस्थान</b><small>डैशबोर्ड</small></div>
    <nav id="tabs"></nav>
    <div class="side-foot">
      <a href="index.html" target="_blank" rel="noopener">वेबसाइट देखें</a>
      <button type="button" id="logout" class="linkish">लॉग आउट</button>
    </div>
  </aside>
  <div class="content">
    <header class="bar">
      <button class="menu" id="menu" aria-label="मेन्यू">☰</button>
      <h1 id="pageTitle"></h1>
      <span id="dirty" class="dirty" hidden>बिना-प्रकाशित बदलाव</span>
      <div class="bar-actions">
        <a class="btn btn-ghost btn-sm" href="index.html?preview=1" target="_blank" rel="noopener">पूर्वावलोकन</a>
        <button class="btn btn-primary btn-sm" id="publishBtn" type="button">वेबसाइट पर प्रकाशित करें</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm" novalidate>
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button type="button" class="x" id="dlgX" aria-label="बंद करें">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot"><button type="button" class="btn btn-ghost" id="dlgCancel">रद्द करें</button><button type="submit" class="btn btn-primary" id="dlgSave">सहेजें</button></div>
</form></dialog>

<script src="assets/js/data-default.js?v=9"></script>
<script src="assets/js/admin.js?v=6"></script>
</body>
</html>
